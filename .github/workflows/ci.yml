name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        shell: pwsh
        run: .\build.ps1 -Lint

      - name: Test
        shell: pwsh
        run: .\build.ps1 -Test

      - name: Build
        shell: pwsh
        # Build-only smoke check: the staged module must be valid and the
        # manifest must parse. Publishing versions are handled by publish.yml,
        # which takes its version from the tag.
        run: .\build.ps1 -Build

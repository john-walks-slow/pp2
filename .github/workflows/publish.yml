name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PSResourceGet
        shell: pwsh
        run: |
          # build.ps1 publishes with Publish-PSResource (PSResourceGet), which
          # packs in-process. PowerShellGet v2's Publish-Module shells out to
          # nuget.exe and parses its stdout with an English-only regex, which
          # fails on non-English hosts.
          if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force
          }

      - name: Lint
        shell: pwsh
        run: .\build.ps1 -Lint

      - name: Test
        shell: pwsh
        run: .\build.ps1 -Test

      - name: Build and Publish
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $Version = "${{ github.ref_name }}" -replace '^v', ''
          if ($Version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag '${{ github.ref_name }}' is not a semver version (expected vMAJOR.MINOR[.PATCH])."
          }
          .\build.ps1 -Version $Version -Build -Publish -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery

# WinGet Package Manifest Template
# This is a template for future winget package submission
# To submit: wingetcreate new or manual submission to https://github.com/microsoft/winget-pkgs

Id: john-walks-slow.pp2
Version: 1.0.0
Name: pp2 - PowerShell Process Manager
Publisher: john-walks-slow
Author: john-walks-slow
Homepage: https://github.com/john-walks-slow/pp2
License: MIT
LicenseUrl: https://github.com/john-walks-slow/pp2/blob/main/LICENSE
Description: PowerShell-based service manager for managing background processes with dependency handling, auto-restart, and monitoring.
Tags:
  - powershell
  - process-manager
  - pm2
  - service-manager
  - windows

# NOTE: WinGet requires an installer (exe, msi, msix)
# For PowerShell scripts, you would need to:
# 1. Create an MSI wrapper using WiX Toolset
# 2. Or create a self-extracting exe installer
# 3. Or submit as a "portable" package with zip

# Example portable manifest (zip-based):
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/john-walks-slow/pp2/archive/refs/heads/main.zip
    InstallerSha256: <CALCULATE_SHA256>
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: pp2-main/pp2.ps1
        PortableCommandAlias: pp2

# For now, recommend using the install script directly:
# irm https://raw.githubusercontent.com/john-walks-slow/pp2/main/install.ps1 | iex
